<script>
// ═══════════════════════════════════════════════════════
//  CONFIGURATION
// ═══════════════════════════════════════════════════════
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

// ═══════════════════════════════════════════════════════
//  DATABASE ENGINE
// ═══════════════════════════════════════════════════════
const DB = (() => {
  let db;
  const DB_NAME = 'EbookReaderDB', DB_VERSION = 5; // Bumped version to ensure clean index creation

  function open() {
    return new Promise((res, rej) => {
      if (db) return res(db);
      const req = indexedDB.open(DB_NAME, DB_VERSION);
      req.onupgradeneeded = e => {
        const d = e.target.result;
        if (!d.objectStoreNames.contains('books')) {
          const bs = d.createObjectStore('books', { keyPath: 'id' });
          bs.createIndex('lastOpened', 'lastOpened');
        }
        if (!d.objectStoreNames.contains('progress')) d.createObjectStore('progress', { keyPath: 'bookId' });
        if (!d.objectStoreNames.contains('bookmarks')) {
          const bm = d.createObjectStore('bookmarks', { keyPath: 'id' });
          bm.createIndex('bookId', 'bookId');
        }
        if (!d.objectStoreNames.contains('wordBank')) {
          const wb = d.createObjectStore('wordBank', { keyPath: 'id' });
          wb.createIndex('bookId', 'bookId');
        }
      };
      req.onsuccess = e => { db = e.target.result; res(db); };
      req.onerror = () => rej(req.error);
    });
  }

  function tx(store, mode = 'readonly') { return db.transaction(store, mode).objectStore(store); }
  
  function get(store, key) {
    return open().then(() => new Promise((res, rej) => {
      const req = tx(store).get(key);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    }));
  }

  function put(store, val) {
    return open().then(() => new Promise((res, rej) => {
      const req = tx(store, 'readwrite').put(val);
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    }));
  }

  function del(store, key) {
    return open().then(() => new Promise((res, rej) => {
      const req = tx(store, 'readwrite').delete(key);
      req.onsuccess = () => res();
      req.onerror = () => rej(req.error);
    }));
  }

  function getAll(store) {
    return open().then(() => new Promise((res, rej) => {
      const req = tx(store).getAll();
      req.onsuccess = () => res(req.result);
      req.onerror = () => rej(req.error);
    }));
  }

  return { get, put, del, getAll, open };
})();

// ═══════════════════════════════════════════════════════
//  SETTINGS & STATE
// ═══════════════════════════════════════════════════════
const Settings = {
  state: {
    apiKey: localStorage.getItem('openrouter_api_key') || '',
    theme: localStorage.getItem('reader_theme') || 'light',
    fontSize: parseInt(localStorage.getItem('reader_font_size')) || 18,
    lineHeight: parseFloat(localStorage.getItem('reader_line_height')) || 1.5,
    fontFamily: localStorage.getItem('reader_font_family') || 'serif'
  },

  init() {
    this.applyTheme(this.state.theme);
    this.applyFontSettings();
    
    // Update settings UI
    document.getElementById('api-key-input').value = this.state.apiKey;
    document.getElementById('api-key-input').placeholder = "Paste OpenRouter API Key...";
    document.querySelector('.settings-section-title').textContent = "🤖 OpenRouter / Groq API";
    
    document.getElementById('font-size-slider').value = this.state.fontSize;
    document.getElementById('line-height-slider').value = this.state.lineHeight * 10;
  },

  saveApiKey() {
    const key = document.getElementById('api-key-input').value.trim();
    this.state.apiKey = key;
    localStorage.setItem('openrouter_api_key', key);
    App.toast("OpenRouter API Key saved");
  },

  async testApiKey() {
    const resultDiv = document.getElementById('api-test-result');
    resultDiv.style.display = 'block';
    resultDiv.className = 'test-api-result';
    resultDiv.textContent = "Testing connection to Groq via OpenRouter...";

    try {
      await AI.fetchDefinition("book", "Reading a book.", "simple");
      resultDiv.className = 'test-api-result success';
      resultDiv.textContent = "✅ Success! API is working.";
    } catch (e) {
      resultDiv.className = 'test-api-result error';
      resultDiv.textContent = "❌ Error: " + e.message;
    }
  },

  setTheme(theme, el) {
    this.state.theme = theme;
    localStorage.setItem('reader_theme', theme);
    this.applyTheme(theme);
    if (el) {
      document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
    }
  },

  applyTheme(theme) {
    const themes = {
      light: { bg: '#faf7f0', text: '#2c2416' },
      sepia: { bg: '#f4ecd8', text: '#5b4636' },
      dark: { bg: '#1a1a2e', text: '#e8e4d9' },
      night: { bg: '#0d0d0d', text: '#a0a0a0' }
    };
    const t = themes[theme];
    document.documentElement.style.setProperty('--r-bg', t.bg);
    document.documentElement.style.setProperty('--r-text', t.text);
    document.body.setAttribute('data-theme', theme);
  },

  setFont(font, el) {
    this.state.fontFamily = font;
    localStorage.setItem('reader_font_family', font);
    this.applyFontSettings();
    document.querySelectorAll('.font-option').forEach(o => o.classList.remove('active'));
    el.classList.add('active');
  },

  onFontSize(el) {
    this.state.fontSize = parseInt(el.value);
    document.getElementById('font-size-val').textContent = el.value;
    localStorage.setItem('reader_font_size', el.value);
    this.applyFontSettings();
  },

  onLineHeight(el) {
    const val = el.value / 10;
    this.state.lineHeight = val;
    document.getElementById('line-height-val').textContent = val;
    localStorage.setItem('reader_line_height', val);
    this.applyFontSettings();
  },

  applyFontSettings() {
    const root = document.documentElement;
    root.style.setProperty('--reader-font-size', this.state.fontSize + 'px');
    root.style.setProperty('--reader-line-height', this.state.lineHeight);
    const families = { serif: 'Georgia, serif', sans: 'Arial, sans-serif', mono: 'monospace' };
    root.style.setProperty('--reader-font-family', families[this.state.fontFamily]);
    
    ['txt-viewer', 'epub-viewer'].forEach(id => {
      const el = document.getElementById(id);
      if(el) {
        el.style.fontSize = this.state.fontSize + 'px';
        el.style.lineHeight = this.state.lineHeight;
        el.style.fontFamily = families[this.state.fontFamily];
      }
    });
  }
};

// ═══════════════════════════════════════════════════════
//  OPENROUTER / GROQ API ENGINE
// ═══════════════════════════════════════════════════════
const AI = {
  async fetchDefinition(word, context, depth) {
    const key = Settings.state.apiKey;
    if (!key) throw new Error("API key is missing. Please add it in Settings.");

    const url = "https://openrouter.ai/api/v1/chat/completions";
    
    const depthPrompts = {
      simple: "Provide a 1-sentence simple definition.",
      normal: "Provide a clear definition and one example sentence.",
      deep: "Provide etymology, nuanced definition, and two literary examples."
    };

    const prompt = `Define the word "${word}" as used in this context: "${context}". ${depthPrompts[depth]} 
    You MUST return your response as a valid JSON object strictly matching this format: {"definition": "your definition here", "example": "your example here"}. 
    Do not include markdown formatting like \`\`\`json or any conversational text.`;

    const resp = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${key}`,
        'HTTP-Referer': window.location.href, // Required by OpenRouter
        'X-Title': 'Librarium Ebook Reader', // Required by OpenRouter
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        model: "groq/llama3-8b-8192", // Using Groq's high-speed Llama 3
        messages: [{ role: "user", content: prompt }],
        temperature: 0.1
      })
    });

    if (!resp.ok) {
      const errorData = await resp.json();
      throw new Error(errorData.error?.message || "API Request Failed");
    }

    const data = await resp.json();
    let text = data.choices[0].message.content.trim();
    
    // Cleanup in case the LLM disobeys and wraps in markdown
    text = text.replace(/```json/g, '').replace(/```/g, '').trim();
    
    try {
      return JSON.parse(text);
    } catch (e) {
      throw new Error("AI returned malformed data.");
    }
  }
};

// ═══════════════════════════════════════════════════════
//  WORD BANK ENGINE
// ═══════════════════════════════════════════════════════
const WordBank = {
  async render() {
    const words = await DB.getAll('wordBank');
    const container = document.getElementById('wordbank-list');
    
    if (words.length === 0) {
      container.innerHTML = `<div class="wordbank-empty"><div class="empty-icon">🔤</div><div>Your word bank is empty.<br>Highlight words while reading to save them!</div></div>`;
      return;
    }

    container.innerHTML = '';
    words.reverse().forEach(w => {
      const el = document.createElement('div');
      el.className = 'word-entry';
      el.innerHTML = `
        <div class="word-entry-header">
          <div class="word-entry-word">${w.word}</div>
          <button class="word-del-btn" onclick="WordBank.deleteWord('${w.id}')">🗑️</button>
        </div>
        <div class="word-entry-context">"${w.context}"</div>
        <div class="word-entry-def">${w.definition}</div>
      `;
      container.appendChild(el);
    });
  },

  async deleteWord(id) {
    await DB.del('wordBank', id);
    App.toast("Word removed");
    this.render();
  },

  async clearAll() {
    if(confirm("Are you sure you want to delete all saved words?")) {
      const words = await DB.getAll('wordBank');
      for(let w of words) await DB.del('wordBank', w.id);
      this.render();
      App.toast("Word bank cleared");
    }
  },

  async exportCSV() {
    const words = await DB.getAll('wordBank');
    if (words.length === 0) return App.toast("Nothing to export");
    
    let csv = "Word,Context,Definition,Example\n";
    words.forEach(w => {
      csv += `"${w.word}","${w.context.replace(/"/g, '""')}","${w.definition.replace(/"/g, '""')}","${w.example.replace(/"/g, '""')}"\n`;
    });

    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Librarium_WordBank.csv';
    a.click();
  }
};

// ═══════════════════════════════════════════════════════
//  CORE APP LOGIC
// ═══════════════════════════════════════════════════════
const App = {
  currentBook: null,
  pdfDoc: null,
  epubBook: null,
  pageNum: 1,
  selection: { word: '', context: '', definition: '', example: '', depth: 'simple' },
  itemToDelete: null,

  async init() {
    Settings.init();
    await DB.open(); // Ensure DB is open before loading shelf
    this.loadBookshelf();
    this.initSelectionListener();
  },

  // --- VIEWS & NAVIGATION ---
  showBookshelf() {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.getElementById('bookshelf-view').classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.nav-item')[0].classList.add('active');
    this.loadBookshelf();
  },

  showWordBank() {
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.getElementById('wordbank-view').classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelectorAll('.nav-item')[1].classList.add('active');
    WordBank.render();
  },

  closeReader() {
    this.showBookshelf();
  },

  // --- FILE HANDLING ---
  pickFile() { document.getElementById('file-input').click(); },

  async handleFile(input) {
    const file = input.files[0];
    if (!file) return;

    document.getElementById('import-overlay').classList.add('show');
    
    const reader = new FileReader();
    reader.onload = async (e) => {
      const book = {
        id: 'book_' + Date.now(),
        title: file.name.replace(/\.[^/.]+$/, ""),
        format: file.name.split('.').pop().toUpperCase(),
        data: e.target.result,
        lastOpened: Date.now()
      };

      try {
        await DB.put('books', book);
        this.loadBookshelf();
        this.toast("Book imported successfully!");
      } catch(err) {
        this.toast("Error saving book. File may be too large.");
      } finally {
        document.getElementById('import-overlay').classList.remove('show');
        input.value = ''; // Reset file input
      }
    };
    
    // Always read as ArrayBuffer for PDF and EPUB to prevent corruption. TXT can be text.
    if (file.name.toLowerCase().endsWith('.txt')) {
      reader.readAsText(file);
    } else {
      reader.readAsArrayBuffer(file);
    }
  },

  async loadBookshelf() {
    const books = await DB.getAll('books');
    const grid = document.getElementById('books-grid');
    const empty = document.getElementById('empty-state');
    const stats = document.getElementById('shelf-stats');

    if (books.length === 0) {
      grid.style.display = 'none';
      stats.style.display = 'none';
      empty.style.display = 'flex';
      return;
    }

    empty.style.display = 'none';
    stats.style.display = 'flex';
    grid.style.display = 'grid';
    grid.innerHTML = '';
    
    document.getElementById('stat-books').textContent = books.length;

    books.sort((a, b) => b.lastOpened - a.lastOpened).forEach(book => {
      const card = document.createElement('div');
      card.className = 'book-card';
      card.innerHTML = `
        <div class="book-cover" onclick="App.openBook('${book.id}')">
          <div class="format-badge">${book.format}</div>
          <div class="cover-placeholder">
            <div class="cover-letter">${book.title.charAt(0)}</div>
            <div class="cover-label">Librarium</div>
          </div>
          <button class="delete-btn" onclick="event.stopPropagation(); App.promptDelete('${book.id}')">✕</button>
        </div>
        <div class="book-info">
          <div class="book-title">${book.title}</div>
          <div class="book-meta">${new Date(book.lastOpened).toLocaleDateString()}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  },

  async openBook(id) {
    const book = await DB.get('books', id);
    if (!book) return this.toast("Book not found");
    
    this.currentBook = book;
    document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
    document.getElementById('reader-view').classList.remove('hidden');
    document.getElementById('reader-title').textContent = book.title;
    
    book.lastOpened = Date.now();
    await DB.put('books', book);

    // Hide all viewers initially
    document.getElementById('pdf-canvas').style.display = 'none';
    document.getElementById('txt-viewer').style.display = 'none';
    document.getElementById('epub-viewer').style.display = 'none';

    try {
      if (book.format === 'PDF') await this.renderPDF(book.data);
      else if (book.format === 'TXT') this.renderTXT(book.data);
      else if (book.format === 'EPUB') this.renderEPUB(book.data);
      else this.toast(`Format ${book.format} viewer in development.`);
    } catch(e) {
      this.toast("Error rendering book format.");
      console.error(e);
    }
  },

  renderTXT(data) {
    const viewer = document.getElementById('txt-viewer');
    viewer.style.display = 'block';
    viewer.textContent = data;
    document.getElementById('page-counter').textContent = "Text View";
  },

  async renderPDF(data) {
    document.getElementById('page-loading').classList.add('show');
    const loadingTask = pdfjsLib.getDocument({ data: new Uint8Array(data) });
    this.pdfDoc = await loadingTask.promise;
    this.pageNum = 1;
    await this.renderPDFPage(this.pageNum);
    document.getElementById('page-loading').classList.remove('show');
  },

  async renderPDFPage(num) {
    const page = await this.pdfDoc.getPage(num);
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const viewport = page.getViewport({ scale: 1.5 });
    
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    canvas.style.display = 'block';

    await page.render({ canvasContext: ctx, viewport }).promise;
    
    document.getElementById('page-counter').textContent = `Page ${num} of ${this.pdfDoc.numPages}`;
    document.getElementById('progress-slider').max = this.pdfDoc.numPages;
    document.getElementById('progress-slider').value = num;
  },

  renderEPUB(data) {
    const viewer = document.getElementById('epub-viewer');
    viewer.style.display = 'block';
    viewer.innerHTML = ''; // Clear previous
    this.epubBook = ePub(data);
    const rendition = this.epubBook.renderTo("epub-viewer", { width: "100%", height: "100%" });
    rendition.display();
    document.getElementById('page-counter').textContent = "EPUB View";
  },

  // --- SELECTION & AI POPUP ---
  initSelectionListener() {
    document.getElementById('reader-content').addEventListener('mouseup', () => {
      setTimeout(() => this.checkSelection(), 100);
    });
    document.getElementById('reader-content').addEventListener('touchend', () => {
      setTimeout(() => this.checkSelection(), 300);
    });
  },

  checkSelection() {
    const sel = window.getSelection();
    const text = sel.toString().trim();
    // Only trigger on single words (no spaces) under 30 chars
    if (text && text.length > 1 && text.length < 30 && !text.includes(' ')) {
      // Attempt to grab surrounding context safely
      let context = "Context unavailable";
      if(sel.anchorNode && sel.anchorNode.textContent) {
         const fullStr = sel.anchorNode.textContent;
         const start = Math.max(0, fullStr.indexOf(text) - 40);
         const end = Math.min(fullStr.length, fullStr.indexOf(text) + text.length + 40);
         context = fullStr.substring(start, end).trim() + "...";
      }
      this.showPopup(text.replace(/[^\w\s-]/gi, ''), context);
    }
  },

  async showPopup(word, context) {
    this.selection.word = word;
    this.selection.context = context;
    
    document.getElementById('popup-word-text').textContent = word;
    document.getElementById('word-popup').classList.add('show');
    document.getElementById('popup-content').innerHTML = `
      <div class="popup-loading">
        <div class="spinner"></div>
        <div class="loading-text">Asking Groq / OpenRouter...</div>
      </div>`;
    
    const saveBtn = document.getElementById('popup-save-btn');
    saveBtn.className = 'popup-save-btn';
    saveBtn.textContent = '📚 Save';
    
    this.fetchDefinitionForPopup();
  },

  setDepth(depth, el) {
    this.selection.depth = depth;
    document.querySelectorAll('.depth-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    this.fetchDefinitionForPopup();
  },

  async fetchDefinitionForPopup() {
    try {
      const res = await AI.fetchDefinition(this.selection.word, this.selection.context, this.selection.depth);
      this.selection.definition = res.definition;
      this.selection.example = res.example;
      
      document.getElementById('popup-content').innerHTML = `
        <div class="definition-box">
          <div class="box-label">Definition</div>
          <div class="box-content">${res.definition}</div>
        </div>
        <div class="example-box">
          <div class="box-label">Example</div>
          <div class="box-content"><em>"${res.example}"</em></div>
        </div>
      `;
    } catch (e) {
      document.getElementById('popup-content').innerHTML = `
        <div class="popup-error">
          Failed to fetch definition.<br><br>
          <span style="color:var(--danger)">${e.message}</span>
        </div>`;
    }
  },

  async saveToWordBank() {
    if (!this.selection.definition) return;
    
    const wordData = {
      id: 'word_' + Date.now(),
      bookId: this.currentBook ? this.currentBook.id : 'unknown',
      word: this.selection.word,
      context: this.selection.context,
      definition: this.selection.definition,
      example: this.selection.example,
      timestamp: Date.now()
    };

    await DB.put('wordBank', wordData);
    
    const btn = document.getElementById('popup-save-btn');
    btn.className = 'popup-save-btn saved';
    btn.textContent = '✅ Saved';
    this.toast("Saved to Word Bank");
  },

  // --- MODALS & SETTINGS ---
  showSettings() { document.getElementById('settings-panel').classList.add('show'); },
  closeSettings() { document.getElementById('settings-panel').classList.remove('show'); },
  closeSettingsIfOutside(e) { if(e.target.id === 'settings-panel') this.closeSettings(); },
  
  closePopup() { document.getElementById('word-popup').classList.remove('show'); window.getSelection().removeAllRanges(); },
  closePopupIfOutside(e) { if(e.target.id === 'word-popup') this.closePopup(); },

  showBookmarks() { document.getElementById('bookmarks-panel').classList.add('show'); },
  closeBookmarks() { document.getElementById('bookmarks-panel').classList.remove('show'); },
  closeBookmarksIfOutside(e) { if(e.target.id === 'bookmarks-panel') this.closeBookmarks(); },

  promptDelete(id) {
    this.itemToDelete = id;
    document.getElementById('confirm-modal').classList.add('show');
  },
  confirmCancel() {
    this.itemToDelete = null;
    document.getElementById('confirm-modal').classList.remove('show');
  },
  async confirmOk() {
    if (this.itemToDelete) {
      await DB.del('books', this.itemToDelete);
      this.toast("Book deleted");
      this.loadBookshelf();
    }
    this.confirmCancel();
  },

  toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }
};

// Start the app immediately
App.init();
</script>
